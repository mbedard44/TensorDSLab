[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "tensor-dslab"
version = "0.2.0"
description = "Tensor-native detector data-lab products and transforms."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Michael Bedard, Princeton University" },
]
dependencies = [
    "numpy==2.5.1",
    "pint==0.25.3",
    "torch>=2.13,<2.14",
    "tensor-core @ git+https://github.com/mbedard44/TensorCore.git@19bfae35fbc773b55cac7bcd659dda57c4dee6d6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tensor_dslab"]
