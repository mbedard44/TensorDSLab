[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "tensor-dslab"
version = "0.1.0"
description = "Tensor-native detector data-lab products and transforms."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Michael Bedard, Princeton University" },
]
dependencies = [
    "numpy==2.5.1",
    "pint==0.25.3",
    "torch>=2.13,<2.14",
    "tensor-core @ git+https://github.com/mbedard44/TensorCore.git@78d0891bf6c0fefbcad4abe09980867c54202a9e",
]

[project.optional-dependencies]
demos = [
    "ipykernel==7.3.0",
    "matplotlib==3.11.1",
    "nbclient==0.11.0",
    "nbformat==5.10.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tensor_dslab"]
